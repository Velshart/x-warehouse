<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error | x-warehouse</title>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col justify-between">

<header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 rounded-lg bg-amber-500 flex items-center justify-center shadow-md shadow-amber-500/10">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 text-slate-950">
                    <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd"/>
                </svg>
            </div>
            <span class="text-lg font-bold tracking-wider text-white">x-warehouse</span>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 text-center space-y-6">
        <div class="mx-auto h-16 w-16 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center">
            <svg class="h-8 w-8" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <div class="space-y-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">An error occurred</h1>
            <p class="text-sm text-slate-400 leading-relaxed" th:text="${errorMessage}">
                Something went wrong on the server side.
            </p>
        </div>

        <div class="pt-4">
            <a th:href="@{/dashboard}" class="inline-flex items-center justify-center w-full px-4 py-2.5 text-sm font-semibold rounded-lg text-slate-950 bg-amber-500 hover:bg-amber-400 transition shadow-md shadow-amber-500/5">
                Return to Dashboard
            </a>
        </div>
    </div>
</main>

<footer class="border-t border-slate-800/60 py-4 bg-slate-950/20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600">
        &copy; 2026 x-warehouse core logistics. Internal Server Error (500).
    </div>
</footer>

</body>
</html>
